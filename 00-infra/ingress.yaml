apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: k8s-demo
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - backend:
          service:
            name: backend-service
            port:
              number: 8000
        path: /api
        pathType: Prefix
      - backend:
          service:
            name: backend-service
            port:
              number: 8000
        path: /ready
        pathType: Prefix
      - backend:
          service:
            name: frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix

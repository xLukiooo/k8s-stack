apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
  name: frontend
  namespace: k8s-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend-service-account
      containers:
      - image: xlukiooo/k8s-frontend:1.0
        name: k8s-frontend
        ports:
        - containerPort: 80
        resources: 
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
      

